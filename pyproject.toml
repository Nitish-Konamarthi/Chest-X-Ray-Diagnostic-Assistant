[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chest-xray-diagnosis"
version = "1.0.1"
description = "AI-powered chest X-ray diagnostic assistant with CheXNet, Grad-CAM++ heatmaps, Gemini AI explanations, and nearby doctor recommendations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Nitish Konamarthi"},
]
keywords = [
    "medical-ai",
    "chest-xray",
    "chexnet",
    "gradcam",
    "diagnostic",
    "deep-learning",
    "pytorch",
    "densenet",
    "radiology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=9.0.0",
    "numpy>=1.21.0",
    "opencv-python-headless>=4.5.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.5",
    "python-dotenv>=1.0.0",
    "google-genai>=0.2.0",
    "requests>=2.28.0",
    "huggingface-hub>=0.20.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.scripts]
chest-xray-diagnosis = "chexray_diagnosis.cli:main"

[project.urls]
Homepage = "https://github.com/Nitish-Konamarthi/Chest-X-Ray-Diagnostic-Assistant"
Documentation = "https://github.com/Nitish-Konamarthi/Chest-X-Ray-Diagnostic-Assistant#readme"
Repository = "https://github.com/Nitish-Konamarthi/Chest-X-Ray-Diagnostic-Assistant"
Issues = "https://github.com/Nitish-Konamarthi/Chest-X-Ray-Diagnostic-Assistant/issues"

[tool.setuptools.packages.find]
include = ["chexray_diagnosis*"]
exclude = [
    "chexnet*",
    "data*",
    "scripts*",
    "frontend*",
    "backend*",
    "docs*",
    "tests*",
]
